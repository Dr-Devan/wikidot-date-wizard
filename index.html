<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikidot Date Generator</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://community.wikidot.com/common--javascript/init.combined.js"></script>
    <script src="script.js?v=6" defer></script>
</head>
<body id="html-body">
<main class="container">
    <header class="header">
        <h2 id="title">Wikidot Date Generator</h2>
        <div class="language-control">
            <label class="label-with-icon" for="language"><span class="material-symbols-outlined" aria-hidden="true">translate</span><span id="language-label">Language</span></label>
            <select id="language" aria-label="Language">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh-CN">中文（简体）</option>
                <option value="da">Dansk</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="it">Italiano</option>
                <option value="pl">Polski</option>
                <option value="ru">Русский</option>
                <option value="sr">Српски</option>
            </select>
        </div>
    </header>

    <div class="group">
        <label class="label-with-icon" for="year"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span><span id="date-label">Set Date &amp; Time</span></label>
        <div class="controls">
            <select id="year" aria-label="Year"></select>
            <select id="month" aria-label="Month"></select>
            <select id="day" aria-label="Day"></select>
            <span class="separator" aria-hidden="true">|</span>
            <select id="hour" aria-label="Hour"></select> : <select id="minute" aria-label="Minute"></select>
            <button class="btn-now" id="now" type="button"><span class="material-symbols-outlined" aria-hidden="true">schedule</span><span id="now-label">NOW</span></button>
        </div>
    </div>

    <div class="group">
        <label class="label-with-icon" for="format"><span class="material-symbols-outlined" aria-hidden="true">tune</span><span id="format-label">Format String</span></label>
        <input type="text" id="format" value="%Y. %m. %d|agohover" aria-describedby="error">
        <div id="error" class="error" role="status" aria-live="polite"></div>
    </div>

    <div class="preview-box">
        <div class="section-label label-with-icon"><span class="material-symbols-outlined" aria-hidden="true">visibility</span><span id="preview-label">PREVIEW</span></div>
        <div id="preview-text" aria-live="polite"></div>
    </div>

    <div class="result-area">
        <div class="section-label label-with-icon"><span class="material-symbols-outlined" aria-hidden="true">code</span><span id="code-label">Wikidot Code</span></div>
        <code class="code-display" id="result-code"></code>
        <div class="result-actions">
            <button class="btn-copy" id="copy" type="button">
                <span class="material-symbols-outlined" aria-hidden="true">content_copy</span>
                <span id="copy-label">Copy code</span>
            </button>
        </div>
    </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
