<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikidot Date Generator</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://community.wikidot.com/common--javascript/init.combined.js"></script>
    <script src="script.js?v=4" defer></script>
</head>
<body id="html-body">
<main class="container">
    <header class="header">
        <h2 id="title">Wikidot Date Generator</h2>
        <div class="language-control">
            <label id="language-label" for="language">Language</label>
            <select id="language" aria-label="Language">
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
        </div>
    </header>

    <div class="group">
        <label id="date-label" for="year">Set Date &amp; Time</label>
        <div class="controls">
            <select id="year" aria-label="Year"></select>
            <select id="month" aria-label="Month"></select>
            <select id="day" aria-label="Day"></select>
            <span class="separator" aria-hidden="true">|</span>
            <select id="hour" aria-label="Hour"></select> : <select id="minute" aria-label="Minute"></select>
            <button class="btn-now" id="now" type="button">NOW</button>
        </div>
    </div>

    <div class="group">
        <label id="format-label" for="format">Format String</label>
        <input type="text" id="format" value="%Y. %m. %d|agohover" aria-describedby="error">
        <div id="error" class="error" role="status" aria-live="polite"></div>
    </div>

    <div class="preview-box">
        <label id="preview-label" class="section-label">PREVIEW</label>
        <div id="preview-text" aria-live="polite"></div>
    </div>

    <div class="result-area">
        <label id="code-label">Wikidot Code</label>
        <code class="code-display" id="result-code"></code>
        <div class="result-actions">
            <button class="btn-copy" id="copy" type="button">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
                <span id="copy-label">Copy code</span>
            </button>
        </div>
    </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
